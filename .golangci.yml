version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
          disabled: true # main/internal packages: no exported API to document yet

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 5m

issues:
  # Report every finding: the defaults cap the list, hiding the real size.
  max-issues-per-linter: 0
  max-same-issues: 0
